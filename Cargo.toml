[package]
name = "dog-whistle"
version = "0.1.0"
edition = "2021"
description = "Find lost tamed wolves in Minecraft worlds by searching through region files"
license = "MIT"
repository = "https://github.com/yourusername/dog-whistle"
keywords = ["minecraft", "nbt", "region", "wolf", "pet", "dog"]

[[bin]]
name = "dog-whistle"
path = "src/main.rs"

[dependencies]
fastnbt = "2.5"
anvil-region = "0.3"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
uuid = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true